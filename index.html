<!doctype html>
<html lang="en" dir="ltr" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On the Convergence of a Yemeni Mathematician</title>
    <meta name="description" content="A playful 3D story of Prof. Rashad M. Asharabi, mathematician, told as a research paper by his family." />
    <meta name="theme-color" content="#0d1030" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // apply saved language before first paint
      try { var l = localStorage.getItem('lang'); if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; document.documentElement.dataset.lang = 'ar'; } } catch (e) {}
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <a class="skip" href="#taiz">Skip to §1</a>
    <canvas id="world" aria-hidden="true"></canvas>
    <canvas id="intro-canvas" aria-hidden="true"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <header class="hud" role="toolbar" aria-label="Site controls">
      <button class="hud-btn" id="btn-toc" aria-expanded="false" aria-controls="toc"><span class="l-en" lang="en">§ Contents</span><span class="l-ar" lang="ar">§ المحتويات</span></button>
      <span class="hud-spacer"></span>
      <span class="cups" id="cups" title="Hidden Yemeni coffee cups" aria-live="polite">☕ <span id="cups-n">0</span>/<span id="cups-t">8</span></span>
      <button class="hud-btn" id="btn-lang" aria-label="Switch language"><span class="l-en" lang="ar">العربية</span><span class="l-ar" lang="en">English</span></button>
      <div class="sound-wrap">
        <button class="hud-btn" id="btn-sound" aria-pressed="false"><span class="ico">🔇</span> <span class="l-en" lang="en">Tap to enable sound</span><span class="l-ar" lang="ar">اضغط لتفعيل الصوت</span></button>
        <input type="range" id="vol" min="0" max="1" step="0.05" value="0.7" aria-label="Master volume" hidden />
      </div>
    </header>
    <div id="captions" class="captions" aria-live="polite"></div>
    <div id="life-curve-wrap" aria-hidden="true"><canvas id="life-curve"></canvas></div>
    <div id="modal" class="modal" role="dialog" aria-modal="true" hidden><div class="modal-card paper"><button class="modal-x" aria-label="Close">×</button><div class="modal-body"></div></div></div>
    <ol class="calm-timeline" aria-hidden="true"><li data-p="taiz">Taiz</li><li data-p="sanaa">Sana'a</li><li data-p="cairo">Cairo</li><li data-p="lubeck">Lübeck</li><li data-p="najran">Najran</li></ol>
    <!--APP-->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
